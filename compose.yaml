name: aqualino

x-api: &api
  build:
    context: .
    dockerfile: infrastructure/docker/api/Dockerfile
    target: development
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_KEY: ${APP_KEY:-}
    APP_URL: ${APP_URL:-http://localhost:8080}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB:-aqualino}
    DB_USERNAME: ${POSTGRES_USER:-aqualino}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-aqualino_local_only}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-aqualino_redis_local_only}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    LOG_CHANNEL: stderr
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.29.1-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/app/public:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    <<: *api
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    <<: *api
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqualino}
      POSTGRES_USER: ${POSTGRES_USER:-aqualino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqualino_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqualino} -d ${POSTGRES_DB:-aqualino}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-aqualino_redis_local_only}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aqualino_redis_local_only}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

